apiVersion: 1

providers:
  - name: API performance
    orgId: 1
    folder: API
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /var/lib/grafana/dashboards
  - name: Infrastructure
    orgId: 1
    folder: Infrastructure
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards-infrastructure
